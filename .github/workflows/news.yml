name: Placebo in the news (every 2 days)

on:
  schedule:
    - cron: "41 7 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Search news and podcasts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.news
      - name: Commit
        run: |
          git config user.name "sop-bot"
          git config user.email "sop-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "news: update $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
