name: Refresh discussion board

on:
  discussion:
    types: [created, edited, deleted, category_changed]
  discussion_comment:
    types: [created, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  discussions: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export discussions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m pipeline.discussions
      - run: python -m pipeline.build_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
