<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="A clinician and a patient talking in a bright consulting room">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a8"/><stop offset="1" stop-color="#ffb07a"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2b3"/><stop offset="1" stop-color="#ffc857"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fc8c0"/><stop offset="1" stop-color="#3fa39a"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#d9f3ff"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7cf" stop-opacity=".95"/><stop offset="1" stop-color="#fff7cf" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="2.2" fill="#ffffff" fill-opacity=".35"/></pattern>
  </defs>
  <!-- room -->
  <rect width="1200" height="520" fill="url(#wall)"/>
  <rect width="1200" height="520" fill="url(#dots)"/>
  <!-- sunburst behind the pair -->
  <g transform="translate(600 300)" opacity=".55">
    <g fill="#ffe08a">
      <polygon points="0,0 -520,-300 -420,-330"/><polygon points="0,0 -300,-330 -200,-340"/><polygon points="0,0 -80,-340 30,-340"/>
      <polygon points="0,0 200,-340 300,-330"/><polygon points="0,0 420,-330 520,-300"/><polygon points="0,0 600,-160 600,-70"/><polygon points="0,0 -600,-160 -600,-70"/>
    </g>
  </g>
  <circle cx="600" cy="250" r="260" fill="url(#glow)"/>
  <!-- window -->
  <g transform="translate(78 62)">
    <rect x="0" y="0" width="230" height="170" rx="14" fill="#f3f6fa"/>
    <rect x="12" y="12" width="206" height="146" rx="8" fill="url(#sky)"/>
    <circle cx="160" cy="52" r="22" fill="#fff3a6"/>
    <path d="M22 118 C60 92 100 92 140 112 C170 126 195 122 218 108 L218 158 L12 158 Z" fill="#8fd18f"/>
    <rect x="112" y="12" width="6" height="146" fill="#f3f6fa"/><rect x="12" y="82" width="206" height="6" fill="#f3f6fa"/>
  </g>
  <!-- poster / anatomy chart -->
  <g transform="translate(910 60)">
    <rect width="200" height="150" rx="10" fill="#fff8ee" stroke="#e8c9a0" stroke-width="4"/>
    <path d="M100 26 c-22 0 -38 16 -38 36 c0 26 20 36 38 60 c18 -24 38 -34 38 -60 c0 -20 -16 -36 -38 -36z" fill="#ff7b7b"/>
    <path d="M40 118 q30 -40 60 0 t60 0" fill="none" stroke="#5f8fd6" stroke-width="5" stroke-linecap="round"/>
    <path d="M40 126 h120" stroke="#e8c9a0" stroke-width="3"/>
  </g>
  <!-- plant -->
  <g transform="translate(1030 300)">
    <path d="M40 200 h80 l-10 -70 h-60 z" fill="#d97757"/>
    <g fill="#3fa36b">
      <path d="M80 130 C60 90 20 80 10 40 C50 50 80 90 80 130z"/><path d="M80 130 C100 90 140 80 150 40 C110 50 80 90 80 130z"/>
      <path d="M80 130 C70 90 60 40 90 5 C110 40 95 95 80 130z"/><path d="M80 130 C55 110 20 115 0 95 C30 85 65 105 80 130z"/><path d="M80 130 C105 110 140 115 160 95 C130 85 95 105 80 130z"/>
    </g>
  </g>
  <!-- floor -->
  <rect y="400" width="1200" height="120" fill="url(#floor)"/>
  <ellipse cx="600" cy="405" rx="520" ry="16" fill="#2c8a80" opacity=".35"/>
  <!-- desk -->
  <rect x="470" y="330" width="290" height="20" rx="6" fill="#c9743f"/>
  <rect x="490" y="350" width="18" height="60" fill="#a45a2c"/><rect x="722" y="350" width="18" height="60" fill="#a45a2c"/>
  <rect x="500" y="300" width="70" height="30" rx="6" fill="#fff" stroke="#e0d3c2" stroke-width="3"/>
  <line x1="510" y1="311" x2="560" y2="311" stroke="#b9c8d8" stroke-width="4" stroke-linecap="round"/><line x1="510" y1="321" x2="545" y2="321" stroke="#b9c8d8" stroke-width="4" stroke-linecap="round"/>
  <!-- pill bottle + pills on the desk -->
  <g transform="translate(650 270)">
    <rect x="0" y="12" width="44" height="58" rx="10" fill="#ff9a3c"/><rect x="4" y="0" width="36" height="16" rx="5" fill="#fff"/><rect x="8" y="34" width="28" height="18" rx="3" fill="#fff"/>
    <g transform="translate(60 48) rotate(-25)"><rect width="34" height="14" rx="7" fill="#fff"/><rect width="17" height="14" rx="7" fill="#6f8fb0"/><rect x="10" width="7" height="14" fill="#6f8fb0"/></g>
    <g transform="translate(78 62) rotate(20)"><rect width="30" height="12" rx="6" fill="#fff"/><rect width="15" height="12" rx="6" fill="#e9b949"/><rect x="9" width="6" height="12" fill="#e9b949"/></g>
  </g>
  <!-- clinician (left) -->
  <g transform="translate(300 120)">
    <ellipse cx="90" cy="290" rx="70" ry="10" fill="#1a2332" opacity=".18"/>
    <rect x="30" y="150" width="120" height="140" rx="30" fill="#ffffff"/>
    <path d="M30 180 h120 v110 a30 30 0 0 1 -30 30 h-60 a30 30 0 0 1 -30 -30z" fill="#f4f6fb"/>
    <path d="M70 152 l20 40 l20 -40 z" fill="#6fa8dc"/>
    <path d="M60 152 L90 200 L120 152" fill="none" stroke="#e3e8f2" stroke-width="6"/>
    <path d="M66 165 c-10 30 -6 60 24 70 c30 -10 34 -40 24 -70" fill="none" stroke="#1a2332" stroke-width="7" stroke-linecap="round"/>
    <circle cx="90" cy="236" r="10" fill="#c7c9cc" stroke="#1a2332" stroke-width="5"/>
    <rect x="40" y="200" width="26" height="14" rx="3" fill="#ff7b7b"/>
    <rect x="150" y="185" width="70" height="26" rx="13" fill="#ffffff" transform="rotate(-22 150 185)"/>
    <circle cx="219" cy="178" r="16" fill="#e8b48c"/>
    <circle cx="90" cy="95" r="52" fill="#e8b48c"/>
    <path d="M38 88 c0 -40 30 -60 62 -56 c30 4 52 26 50 60 c-10 -20 -30 -22 -52 -20 c-22 2 -44 -6 -60 16z" fill="#3c2a21"/>
    <ellipse cx="72" cy="100" rx="4" ry="5" fill="#1a2332"/><ellipse cx="108" cy="100" rx="4" ry="5" fill="#1a2332"/>
    <path d="M74 120 q16 14 32 0" fill="none" stroke="#1a2332" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="112" r="7" fill="#ff8a8a" opacity=".55"/><circle cx="120" cy="112" r="7" fill="#ff8a8a" opacity=".55"/>
    <rect x="60" y="135" width="60" height="26" rx="10" fill="#e8b48c"/>
    <rect x="45" y="270" width="36" height="20" rx="6" fill="#3f6390"/><rect x="99" y="270" width="36" height="20" rx="6" fill="#3f6390"/>
  </g>
  <!-- patient (right) -->
  <g transform="translate(720 130)">
    <ellipse cx="100" cy="280" rx="80" ry="10" fill="#1a2332" opacity=".18"/>
    <rect x="40" y="130" width="140" height="120" rx="34" fill="#b06ad9"/>
    <rect x="36" y="235" width="150" height="40" rx="14" fill="#5b4bd6"/>
    <rect x="52" y="250" width="40" height="36" rx="10" fill="#3f6390"/><rect x="130" y="250" width="40" height="36" rx="10" fill="#3f6390"/>
    <rect x="-20" y="160" width="80" height="26" rx="13" fill="#b06ad9" transform="rotate(20 -20 160)"/>
    <circle cx="-14" cy="200" r="15" fill="#c98c5b"/>
    <circle cx="110" cy="80" r="50" fill="#c98c5b"/>
    <path d="M56 78 c-4 -44 36 -70 74 -58 c30 10 40 40 34 66 c-12 -22 -40 -20 -58 -14 c-18 6 -38 -2 -50 6z" fill="#e0592b"/>
    <path d="M60 80 c-8 30 0 60 20 74 c-14 -22 -18 -50 -20 -74z" fill="#e0592b"/>
    <ellipse cx="92" cy="86" rx="4" ry="5" fill="#1a2332"/><ellipse cx="128" cy="86" rx="4" ry="5" fill="#1a2332"/>
    <path d="M94 106 q16 12 32 0" fill="none" stroke="#1a2332" stroke-width="4" stroke-linecap="round"/>
    <circle cx="78" cy="98" r="7" fill="#ff8a8a" opacity=".5"/><circle cx="142" cy="98" r="7" fill="#ff8a8a" opacity=".5"/>
    <rect x="80" y="118" width="60" height="24" rx="10" fill="#c98c5b"/>
    <!-- chair back -->
    <rect x="190" y="120" width="26" height="150" rx="10" fill="#ffb347"/>
  </g>
  <!-- speech bubbles -->
  <g transform="translate(440 40)">
    <path d="M0 26 a26 26 0 0 1 26 -26 h96 a26 26 0 0 1 26 26 v34 a26 26 0 0 1 -26 26 h-70 l-30 24 v-24 h-6 a26 26 0 0 1 -26 -26z" fill="#ffffff"/>
    <circle cx="44" cy="43" r="7" fill="#6f8fb0"/><circle cx="74" cy="43" r="7" fill="#e9b949"/><circle cx="104" cy="43" r="7" fill="#ff7b7b"/>
  </g>
  <g transform="translate(830 20)">
    <path d="M0 26 a26 26 0 0 1 26 -26 h80 a26 26 0 0 1 26 26 v30 a26 26 0 0 1 -26 26 h-8 v24 l-30 -24 h-42 a26 26 0 0 1 -26 -26z" fill="#ffffff"/>
    <path d="M40 24 c-14 0 -20 20 -4 30 c8 6 20 2 30 -8 c10 10 22 14 30 8 c16 -10 10 -30 -4 -30 c-8 0 -14 6 -26 18 c-12 -12 -18 -18 -26 -18z" fill="#ff5c7a" transform="scale(.8) translate(14 10)"/>
  </g>
</svg>
